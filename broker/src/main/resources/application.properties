spring.application.name=cf-docker-cpi-broker

# Bind to whatever port CF tells us. Outside CF (local dev / tests) defaults to 8080.
server.port=${PORT:8080}

# Pick up record-style @ConfigurationProperties without an explicit @EnableConfigurationProperties.
spring.config.import=optional:configtree:/run/secrets/

# HTTP Basic credentials — required. Provided at cf push time as env vars.
broker.security.username=${BROKER_USERNAME:}
broker.security.password=${BROKER_PASSWORD:}

# Quieter startup; presented through the actuator if we add one later.
spring.main.banner-mode=off
logging.level.org.springframework.boot.web.embedded.tomcat.TomcatWebServer=WARN
logging.level.org.springframework.cloud.servicebroker=INFO
